<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Congrats Screen</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-indigo-900 to-purple-900 min-h-screen flex flex-col items-center justify-center p-6">

  <div class="bg-gradient-to-b from-indigo-800 to-purple-800 rounded-3xl p-6 w-full max-w-sm shadow-2xl text-white text-center relative">
    
    <!-- Crown and Avatar -->
    <div class="relative w-28 h-28 mx-auto mb-4">
      <img src="https://cdn-icons-png.flaticon.com/512/616/616490.png" alt="Crown" class="w-8 absolute -top-4 left-1/2 transform -translate-x-1/2">
      <img src="https://via.placeholder.com/150" alt="Profile" class="rounded-full border-4 border-pink-500 w-full h-full object-cover">
    </div>

    <!-- Congrats Message -->
    <h1 class="text-2xl font-bold mb-2">CONGRATS 🎉</h1>
    <h2 class="text-lg font-medium mb-4">" Sakibur Rahman "</h2>

    <!-- Correct Answer Box -->
    <div class="bg-gray-800 rounded-2xl p-4 mb-4">
      <p class="text-green-400 text-sm">Correct Answer</p>
      <p class="text-2xl font-bold">10/10</p>
    </div>

    <!-- Points Section -->
    <div class="mb-4">
      <p class="text-pink-400 text-lg font-bold">100 points</p>
    </div>

    <!-- Leaderboard Message -->
    <p class="text-white mb-4">Check leaderboard 😎</p>

    <!-- Leaderboard Button -->
    <button class="bg-gradient-to-r from-orange-400 to-pink-500 text-white font-semibold py-2 px-6 rounded-full shadow-lg hover:scale-105 transition-transform">
      🥇 Leader Board
    </button>

  </div>

</body>
</html>
