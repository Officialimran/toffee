<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Congrats Screen</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-[#2b2e63] to-[#1e0030]  min-h-screen flex items-center justify-center p-4 font-manrope">

  <div class="relative bg-gradient-to-b from-[#2b2e63] to-[#1e0030] rounded-3xl p-6 w-full max-w-sm text-center text-white overflow-hidden">

    <!-- Top Background Graphic -->
    <div class="absolute top-10 left-0 w-full h-48 bg-[url('img/Congrats-Graphic.png')] bg-no-repeat bg-top bg-contain pointer-events-none"></div>

    <!-- Profile and crown -->
    <div class="relative mb-4 mt-24">
      <div class="w-28 h-28 mx-auto border-4 border-pink-500 rounded-full overflow-hidden relative z-10">
        <img src="img/success.png" alt="Profile" class="object-cover w-full h-full">
      </div>
      <div class="absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-8 z-20">
        <div class="w-14 h-10rounded-full flex items-center justify-center">
          <img src="img/Crown.png" alt="" class="class="w-6 h-6">
         
        </div>
      </div>
    </div>

    <!-- Text section -->
    <h1 class="text-2xl font-bold mb-2 font-manrope">CONGRATS 🎉</h1>
    <h2 class="text-lg font-semibold mb-6">“Sakibur Rahman“</h2>

    <!-- Correct Answer -->
    <div class="bg-[#2b2e63] rounded-2xl p-4 mb-4 border border-gray-700">
      <p class="text-[#25D174] text-[16px] font-extrabold mb-1">Correct Answer</p>
      <p class="text-3xl font-bold">10/10</p>
    </div>

    <!-- Points -->
    

    <div class="mb-4">
      <div class="inline-block bg-gradient-to-r  from-gray-800 to-gray-900 font-bold text-lg py-2 px-6 rounded-full shadow-md text-[#FA3282]">
        100 points
      </div>
    </div>

    <!-- Leaderboard Text -->
    <p class="text-white text-[20px] mb-6">Check leaderboard 😎</p>

    <!-- Leaderboard Button -->
    <div class="flex flex-wrap text-center justify-center w-full">
      <button class="w-full text-center justify-center bg-gradient-to-r flex flex-wrap space-x-2 from-yellow-900 to-yellow-600 text-white font-semibold py-3 px-8 rounded-[24px] shadow-lg hover:scale-105 transition-transform" onclick="window.location.href='leaderboard.html'">
        <img src="img/leader-board.png"> 
        <span>Leader Board</span>
      </button>
    </div>

  </div>

  

  

</body>
</html>
