<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leaderboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-b from-[#0f0220] to-[#23044d] min-h-screen p-4 text-white flex flex-col" x-data="leaderboard">

  <!-- Header -->
  <div class="flex items-center justify-between mb-6">
    <div class="bg-[#1c1042] p-2 rounded-full">
      <a href="index.html"><img src="img/home-line.png" alt="Mini Profile" class="w-full h-full object-cover"></a>
    </div>
    <h1 class="text-lg font-bold">Leaderboard</h1>
    <a href="profile.html"><img src="img/success.png" class="w-10 h-10 rounded-full border-2 border-white" alt="Profile"></a>
  </div>

  <!-- Tabs -->
  <div class="flex justify-center bg-[#1c1042] rounded-full p-1 mb-6">
    <button @click="period = 'daily'" :class="period === 'daily' ? 'bg-white text-black font-semibold' : 'text-gray-300'" class="flex-1 text-sm py-2 rounded-full transition">Daily</button>
    <button @click="period = 'monthly'" :class="period === 'monthly' ? 'bg-white text-black font-semibold' : 'text-gray-300'" class="flex-1 text-sm py-2 rounded-full transition">Monthly</button>
  </div>
  

  <!-- Category Filters -->
  <div class="flex justify-center gap-4 mb-4">
    <button @click="category = 'cricket'" :class="category === 'cricket' ? 'bg-white text-black' : 'border border-white text-white hover:bg-white hover:text-black'" class="text-xs px-4 py-1 rounded-full font-semibold transition">Cricket</button>
    <button @click="category = 'movies'" :class="category === 'movies' ? 'bg-white text-black' : 'border border-white text-white hover:bg-white hover:text-black'" class="text-xs px-4 py-1 rounded-full font-semibold transition">Movies</button>
  </div>

  <!-- Leaderboard List -->
  <div class="bg-[#1c1042]/50 rounded-2xl p-4 overflow-y-auto flex-1">
    <template x-for="(player, index) in filteredPlayers" :key="index">
      <div class="flex justify-between items-center border-b border-gray-600 pb-2 mb-2">
        <span class="text-sm font-semibold" x-text="`${index+1}. ${player.name}`"></span>
        <span class="text-xs bg-[#ffffff1a] text-gray-200 px-3 py-1 rounded-full" x-text="`${player.points} Points`"></span>
      </div>
    </template>
  </div>

<script>
document.addEventListener('alpine:init', () => {
  Alpine.data('leaderboard', () => ({
    period: 'monthly',
    category: 'cricket',
    players: {
      daily: {
        cricket: [
          { name: 'Ksenia Romansky', points: 3000 },
          { name: 'Andre Fridman', points: 2500 },
          { name: 'Olivia Dostrod', points: 2100 },
        ],
        movies: [
          { name: 'Jeff Kelsynt', points: 4000 },
          { name: 'Amanda Forlina', points: 2800 },
        ],
      },
      monthly: {
        cricket: [
          { name: 'Ksenia Romansky', points: 7245 },
          { name: 'Andre Fridman', points: 6654 },
          { name: 'Olivia Dostrod', points: 5109 },
          { name: 'Jeff Kelsynt', points: 4287 },
          { name: 'Amanda Forlina', points: 2612 },
          { name: 'Antua Krushkevich', points: 1387 },
        ],
        movies: [
          { name: 'Olivia Dostrod', points: 7200 },
          { name: 'Amanda Forlina', points: 7100 },
          { name: 'Andre Fridman', points: 6800 },
        ],
      },
    },
    get filteredPlayers() {
      return this.players[this.period][this.category];
    },
  }))
})
</script>

</body>
</html>
