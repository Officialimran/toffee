<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailwind CSS Starter</title>
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 text-gray-900">
    
    <div class="w-[1280px] mx-auto p-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-2 group text-center">
        <div class="bg-green-500 col-span-2 items-center bg-[url('grid/Star.png')] bg-cover bg-center p-40">star title</div>
        <div class="bg-gray-500 row-span-2 items-center bg-[url('grid/Cross.png')] bg-cover bg-center p-40">Cross title</div>
        <div class="bg-gray-100 items-center"></div>
        <div class="bg-yellow-500 bg-[url('grid/wave.png')] bg-cover bg-center p-40">wave title</div>
        <div class="bg-red-500 bg-[url('grid/Hexa.png')] bg-cover bg-center p-40">Hexa title</div>
        <div class="bg-blue-500 bg-[url('grid/Rectangular-Plain.png')] bg-cover bg-center p-40 ">ractangular plan title</div>
        <div class="bg-gray-100 items-center"></div>
        <div class="bg-green-500 bg-[url('grid/Square.png')] bg-cover bg-center p-40">squire title</div>
        <div class="bg-red-500 col-span-2 bg-[url('grid/Rectangular-Rustic.png')] bg-cover bg-center p-40">rustic title</div>

    </div>

    
    

  </body>
</html>
