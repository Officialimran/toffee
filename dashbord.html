<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-cover bg-center bg-no-repeat bg-blend-overlay bg-gradient-to-b from-[#0f1123]/90 to-[#1b1d42]/90" style="background-image: url('img/blur.png');">
  <div class="max-w-md mx-auto p-4">
    <!-- Header -->
    <div class="flex justify-between items-center mb-4">
      <div>
        <h1 class="text-2xl font-bold text-white">Hi there!</h1>
        <p class="text-sm text-gray-300">Let the quiz adventure begin!</p>
      </div>
      <a href="profile.html"><img src="img/success.png" class="w-10 h-10 rounded-full border-2 border-white" alt="Profile"></a>
    </div>

    <!-- Daily Progress -->
    <div class="mb-4">
      <h2 class="text-lg font-semibold text-white">Daily Quiz Progress</h2>
      <p class="text-xs text-gray-300">In 24 hours, your progress will reset! Continue to finish!</p>
      <div class="flex justify-between items-center mt-4 space-x-2">
        <div class="flex items-center bg-[#3f2b96] rounded-full px-4 py-2 w-1/2 justify-between">
          <span class="text-sm font-medium text-white">Cricket</span>
          <div class="relative w-14 h-14">
            <div class="absolute inset-0 rounded-full bg-white flex flex-col items-center justify-center text-pink-600 font-bold text-xs">
              <span class="text-base leading-none">45</span>
              <span class="leading-none font-normal">out of</span>
              <span class="leading-none font-normal">100</span>
            </div>
            <div class="absolute -inset-1 border-4 border-pink-500 rounded-full"></div>
          </div>
        </div>

        <div class="flex items-center bg-[#3f2b96] rounded-full px-4 py-2 w-1/2 justify-between">
          <span class="text-sm font-medium text-white">Movies</span>
          <div class="relative w-14 h-14">
            <div class="absolute inset-0 rounded-full bg-white flex flex-col items-center justify-center text-pink-600 font-bold text-xs">
              <span class="text-base leading-none">45</span>
              <span class="leading-none font-normal">out of</span>
              <span class="leading-none font-normal">100</span>
            </div>
            <div class="absolute -inset-1 border-4 border-pink-500 rounded-full"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Quiz Cards -->
    <div class="space-y-4">
      <!-- Cricket Card -->
      <div class="relative overflow-hidden">
        <img src="img/Bg.png" class="w-full h-40 object-cover" alt="Cricket">
        <div class="absolute inset-0 flex items-center justify-between px-5 mt-[6rem]">
          <h3 class="text-xl font-semibold text-white">Cricket</h3>
          <button class="bg-pink-600 text-white px-4 py-2 rounded-full text-sm" onclick="window.location.href='quize.html'">Start Quiz</button>
        </div>
      </div>

      <!-- Movies Card -->
      <div class="relative overflow-hidden bg-transparent">
        <img src="img/movie-bg.png" class="w-full h-40 object-cover" alt="Movies">
        <div class="absolute inset-0 flex items-center justify-between px-5 mt-[6rem]">
          <h3 class="text-xl font-semibold  text-white">Movies</h3>
          <button class="bg-pink-600 text-white px-4 py-2 rounded-full text-sm" onclick="window.location.href='quize.html'">Start Quiz</button>
        </div>
      </div>
    </div>

    <!-- Leader Board Button -->
    <div class="mt-6 text-center">
      <button class="w-full bg-[#F4E5F0] text-[#FEB746] py-3 rounded-xl border border-[#F4E5F0] text-lg flex items-center justify-center gap-2" onclick="window.location.href='leaderboard.html'">
        <img src="img/leader-board.png" class="bg-cover bg-center w-8 h-8">
        Leader Board
      </button>
    </div>
  </div>
</body>
</html>
