<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-[#1e024d] to-[#2d0b62] min-h-screen text-white font-sans">
  <div class="max-w-md mx-auto p-4">
    <!-- Header -->
    <div class="flex justify-between items-center mb-4">
      <div>
        <h1 class="text-2xl font-bold">Hi there!</h1>
        <p class="text-sm text-gray-300">Let the quiz adventure begin!</p>
      </div>
      <img src="https://i.pravatar.cc/40" class="w-10 h-10 rounded-full border-2 border-white" alt="Profile">
    </div>

    <!-- Daily Progress -->
    <div class="mb-4">
      <h2 class="text-lg font-semibold">Daily Quiz Progress</h2>
      <p class="text-xs text-gray-300">In 24 hours, your progress will reset! Continue to finish!</p>
      <div class="flex justify-between gap-4 mt-4">
        <!-- Cricket -->
        <div class="relative flex-1 bg-[#3f2b96] rounded-full flex items-center justify-between pl-4 pr-16 py-3">
          <span class="text-sm font-medium text-white">Cricket</span>
          <div class="absolute right-0 top-1/2 transform -translate-y-1/2 translate-x-1/2 w-20 h-20 bg-white rounded-full flex items-center justify-center shadow-md">
            <div class="w-16 h-16 rounded-full border-[6px] border-pink-500 flex flex-col items-center justify-center text-pink-600 font-bold text-xs">
              <span class="text-lg leading-tight">45</span>
              <span class="leading-none font-normal">out of</span>
              <span class="leading-none font-normal">100</span>
            </div>
          </div>
        </div>

        <!-- Movies -->
        <div class="relative flex-1 bg-[#3f2b96] rounded-full flex items-center justify-between pl-4 pr-16 py-3">
          <span class="text-sm font-medium text-white">Movies</span>
          <div class="absolute right-0 top-1/2 transform -translate-y-1/2 translate-x-1/2 w-20 h-20 bg-white rounded-full flex items-center justify-center shadow-md">
            <div class="w-16 h-16 rounded-full border-[6px] border-pink-500 flex flex-col items-center justify-center text-pink-600 font-bold text-xs">
              <span class="text-lg leading-tight">45</span>
              <span class="leading-none font-normal">out of</span>
              <span class="leading-none font-normal">100</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Quiz Cards -->
    <div class="space-y-4">
      <!-- Cricket Card -->
      <div class="relative rounded-2xl overflow-hidden shadow-xl">
        <img src="https://cdn.pixabay.com/photo/2017/04/20/08/46/baseball-2244130_960_720.jpg" class="w-full h-40 object-cover" alt="Cricket">
        <div class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-between px-5">
          <h3 class="text-xl font-semibold">Cricket</h3>
          <button class="bg-pink-600 text-white px-4 py-2 rounded-full text-sm">Start Quiz</button>
        </div>
      </div>

      <!-- Movies Card -->
      <div class="relative rounded-2xl overflow-hidden shadow-xl">
        <img src="https://cdn.pixabay.com/photo/2016/11/22/21/42/popcorn-1854245_960_720.jpg" class="w-full h-40 object-cover" alt="Movies">
        <div class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-between px-5">
          <h3 class="text-xl font-semibold">Movies</h3>
          <button class="bg-pink-600 text-white px-4 py-2 rounded-full text-sm">Start Quiz</button>
        </div>
      </div>
    </div>

    <!-- Leader Board Button -->
    <div class="mt-6 text-center">
      <button class="w-full bg-[#4b3792] text-white py-3 rounded-xl border border-white text-lg flex items-center justify-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 17l4 4 4-4m0-5l-4-4-4 4" />
        </svg>
        Leader Board
      </button>
    </div>
  </div>
</body>
</html>
